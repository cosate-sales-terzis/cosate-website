{% extends "layout.html" %}

{% block content %}
    <section class="hero-section">
        <div class="hero-background-slider">
            <video id="heroVideo1" class="hero-video is-active" src="{{ url_for('static', filename='assets/videos/video1.mp4') }}" muted playsinline></video>
            <video id="heroVideo2" class="hero-video" src="{{ url_for('static', filename='assets/videos/video2.mp4') }}" muted playsinline></video>
        </div>
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1 class="animate-on-scroll" data-lang-key="hero_title"></h1>
            <p class="animate-on-scroll" data-lang-key="hero_subtitle"></p>
        </div>
    </section>

    <section class="content-section amenities-section">
        <div class="container">
            <div class="section-header animate-on-scroll">
                <h2 data-lang-key="amenities_title"></h2>
            </div>
            <div class="amenities-grid">
                <div class="amenity-item animate-on-scroll">
                    <div class="amenity-icon">🌊</div>
                    <h3 data-lang-key="feature_sea_view"></h3>
                </div>
                <div class="amenity-item animate-on-scroll">
                    <div class="amenity-icon">☀️</div>
                    <h3 data-lang-key="feature_roof_garden"></h3>
                </div>
                <div class="amenity-item animate-on-scroll">
                    <div class="amenity-icon">🚗</div>
                    <h3 data-lang-key="feature_parking"></h3>
                </div>
                <div class="amenity-item animate-on-scroll">
                    <div class="amenity-icon">🌳</div>
                    <h3 data-lang-key="feature_private_garden"></h3>
                </div>
            </div>
            <div class="carousel-dots" id="amenities-dots"></div>
        </div>
    </section>

    <section class="content-section featured-properties">
        <div class="container">
            <div class="section-header animate-on-scroll">
                <h2 data-lang-key="featured_title"></h2>
                <p data-lang-key="featured_subtitle"></p>
            </div>
            <div id="featured-properties-grid" class="properties-grid">
                </div>
            <div class="carousel-dots" id="properties-dots"></div>
        </div>
    </section>
{% endblock %}
